# Template backend settings -- copy this directory to backends/<name>/ and
# set BACKEND=<name> in bench.conf. Sourced after bench.conf.
# Every value may be overridden from the environment.

# Connection settings for your backend, for example:
# MYDB_URL="${MYDB_URL:-http://dbhost:8086}"
# MYDB_DATABASE="${MYDB_DATABASE:-monbench}"

# ---- plugin declarations read by the core
# Writers this backend provides, used when WRITERS is empty.
DEFAULT_WRITERS="py"
# 1 if the backend runs a service on the server nodes that the harness must
# start and stop (serve/stop phases); 0 if the service is managed elsewhere.
PLUGIN_SERVICE=0
# Settings to forward to remote steps, in addition to the core settings.
PLUGIN_VARS=""
