# DSOS backend settings -- sourced after bench.conf when this is the
# write and/or query backend (and, for its serve/stop phases, when it
# runs dsosd).
#
# DSOS queries SOS containers across all servers through the dsosd RPC
# service.  It can also write through dsosd (the dsos writer), which
# stores data in the same SOS containers as the sos backend, so data
# written by either backend can be queried by either.
#
# Every value may be overridden from the environment.

# dsosd command. Prefix with 'sudo -E' if registering with rpcbind requires it.
DSOSD="${DSOSD:-dsosd}"
DSOSQL="${DSOSQL:-dsosql}"
# Rows per batch fetched by the dsos query adapter.
SOS_ROW_LIMIT="${SOS_ROW_LIMIT:-4096}"
# dsosd needs to know where each server's containers are. OUTPUT_DIR is already
# namespaced per write/query pair by bin/run.sh (see its "Backend pairs"
# note), fixed once for the whole pair and shared by every phase in it, so
# this reuses the sos backend's data-root formula with no segment of its own.
# IMPORTANT: when a run pairs this backend with sos as the other side (sos
# writing and dsos querying, or vice versa), both backends run under the
# same pair (e.g. "sos-dsos") and so share the same OUTPUT_DIR -- but this must
# still resolve to the exact same path as SOS_DATA_ROOT in
# backends/sos/sos_backend.conf, since dsosd is reading the containers sos
# wrote. Both files default it to the exact same formula, so it matches
# automatically; if you override SOS_DATA_ROOT here, override it the same
# way in sos_backend.conf too (or set SOS_DATA_ROOT once in the environment
# so both pick up the same value).
SOS_DATA_ROOT="${SOS_DATA_ROOT:-${OUTPUT_DIR}/nodes/${HOST:-${HOSTNAME}}/data}"

# ---- plugin declarations read by the core
PLUGIN_DESC="writes to and queries SOS containers across servers through dsosd"
DEFAULT_WRITERS="dsos"
# dsosd is a service the harness starts and stops on the server nodes.
PLUGIN_SERVICE=1
# Written data this backend can query.
PLUGIN_READS="sos dsos"
# Settings forwarded to remote steps.
PLUGIN_VARS="DSOSD DSOSQL SOS_ROW_LIMIT"
