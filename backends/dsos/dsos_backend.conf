# DSOS query backend settings -- sourced after bench.conf when this is the
# query backend (and, for its serve/stop phases, when it runs dsosd).
#
# DSOS queries SOS containers across all servers through the dsosd RPC service.
# It queries data written by the sos backend; it provides no writer of its own
# yet (the DSOS write API exists and can be added later).
#
# Every value may be overridden from the environment.

# dsosd command. Prefix with 'sudo -E' if registering with rpcbind requires it.
DSOSD="${DSOSD:-dsosd}"
DSOSQL="${DSOSQL:-dsosql}"
# Rows per batch fetched by the dsos query adapter.
SOS_ROW_LIMIT="${SOS_ROW_LIMIT:-4096}"
# dsosd needs to know where each server's containers are; it reuses the sos
# backend's data root.
SOS_DATA_ROOT="${SOS_DATA_ROOT:-${RUN_DIR}/data/${HOSTNAME}}"

# ---- plugin declarations read by the core
PLUGIN_DESC="queries SOS containers across servers through dsosd"
# No writer of its own yet; data is written by the sos backend.
DEFAULT_WRITERS=""
# dsosd is a service the harness starts and stops on the server nodes.
PLUGIN_SERVICE=1
# Written data this backend can query.
PLUGIN_READS="sos dsos"
# Settings forwarded to remote steps.
PLUGIN_VARS="DSOSD DSOSQL SOS_ROW_LIMIT SOS_DATA_ROOT"
