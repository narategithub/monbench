# InfluxDB v3 backend settings -- sourced after bench.conf when this is the
# write and/or query backend. Every value may be overridden from the
# environment.
#
# This backend writes to and queries a single InfluxDB 3 Core server. Unlike
# sos/dsos it is not partitioned across the server hosts: each server host
# generates its own partition and sends it to the same InfluxDB server, so
# together the servers write the whole data set once.
#
# Auth is managed by the harness: plugin_serve_start generates an admin token
# offline before starting influxdb3, writes it as a JSON file under RUN_DIR,
# and passes the file to the server via --admin-token-file. The write and
# query steps read the token from that file. No token needs to be set in
# bench.conf or the environment.

# Where the InfluxDB 3 server listens. Must be reachable from every write
# host and the query host.
INFLUX_HOST="${INFLUX_HOST:-http://${SERVER_HOSTS%% *}:8181}"
# Database (v3 calls it a database; the v1/v2 term is bucket).
INFLUX_DATABASE="${INFLUX_DATABASE:-monbench}"

# Interface used to talk to InfluxDB:
#   python  the influxdb_client_3 library (default)
#   http    the InfluxDB 3 HTTP API directly, via urllib
INFLUX_INTERFACE="${INFLUX_INTERFACE:-python}"
# Query language: sql (default) or influxql.
INFLUX_QUERY_LANG="${INFLUX_QUERY_LANG:-sql}"
# Line-protocol timestamp precision. The data set uses whole seconds.
INFLUX_PRECISION="${INFLUX_PRECISION:-s}"
# Records per write request (http interface) or per batch (python interface).
INFLUX_WRITE_BATCH="${INFLUX_WRITE_BATCH:-10000}"

# Data directory for influxdb3 on each server host. RUN_DIR is already
# namespaced per write/query pair by bin/run.sh (see its "Backend pairs"
# note), so this does not need a backend-name segment of its own: a
# different storage engine's data (e.g. sos/dsos's) never lands in the same
# pair's RUN_DIR in the first place. Defaults to a subdirectory of RUN_DIR so
# the harness owns it and 'clean' wipes it. Override to place data on a
# specific mount (e.g. a fast local disk).
INFLUX_DATA_DIR="${INFLUX_DATA_DIR:-${RUN_DIR}/data/${HOSTNAME}}"

# Path to the JSON token file generated by plugin_serve_start. Set
# automatically; override only if you are managing the token yourself.
INFLUX_TOKEN_FILE="${INFLUX_TOKEN_FILE:-${RUN_DIR}/influxdb3-token.json}"

# ---- plugin declarations read by the core
PLUGIN_DESC="writes to and queries an InfluxDB 3 Core server (token generated at serve time)"
DEFAULT_WRITERS="influx"
# The harness starts and stops influxdb3 on each server host.
PLUGIN_SERVICE=1
# Written data this backend can query.
PLUGIN_READS="influxdb"
PLUGIN_VARS="INFLUX_HOST INFLUX_DATABASE INFLUX_INTERFACE INFLUX_QUERY_LANG INFLUX_PRECISION INFLUX_WRITE_BATCH INFLUX_DATA_DIR INFLUX_TOKEN_FILE"
