# SOS storage settings -- sourced after bench.conf when BACKEND is sos.
#
# This backend writes one local SOS container per server, using the SOS API
# (C or Python), and can query them directly on disk (no dsosd needed).
# Direct query requires the containers to be accessible from the query node
# (shared filesystem, or the query node is a server node).
#
# Every value may be overridden from the environment.

# Installation prefix of SOS, used to build the C writer.
SOS_PREFIX="${SOS_PREFIX:-/opt/ovis}"
# Root of the SOS containers on each server. Each server's containers are
# placed under SOS_DATA_ROOT/<server-id>/, so a shared path is also safe.
# RUN_DIR is already namespaced per write/query pair by bin/run.sh (see its
# "Backend pairs" note), so this does not need a backend-name segment of its
# own: a different backend's data (e.g. influxdb's) never lands in the same
# pair's RUN_DIR in the first place.
# IMPORTANT: when a run pairs this backend with dsos as the other side (sos
# writing and dsos querying, or vice versa), both backends run under the
# same pair (e.g. "sos-dsos"), so they share the same RUN_DIR -- and dsosd
# reads the same on-disk containers sos wrote, so SOS_DATA_ROOT must resolve
# to the same path for both. Both this file and backends/dsos/dsos_backend.conf
# default it to the exact same formula, so it matches automatically as long
# as neither file's default is overridden independently of the other -- if
# you override SOS_DATA_ROOT for one of the two backends, override it the
# same way for the other (or set SOS_DATA_ROOT once in the environment so
# both pick up the same value).
SOS_DATA_ROOT="${SOS_DATA_ROOT:-${RUN_DIR}/data/${HOSTNAME}}"
# SOS storage type for new containers: mmos or lsos.
SOS_STORAGE="${SOS_STORAGE:-mmos}"
# Rows per batch fetched by the sos query adapter.
SOS_ROW_LIMIT="${SOS_ROW_LIMIT:-4096}"

# ---- plugin declarations read by the core
# What this backend does, shown in the check output.
PLUGIN_DESC="writes and queries local SOS containers with the SOS API"
# Writers this backend provides, used when WRITERS is empty.
DEFAULT_WRITERS="c py"
# 1 if the harness must start a service on the server nodes. SOS is a library,
# so writing and querying need no service.
PLUGIN_SERVICE=0
# Backends whose written data this one can query. Checked against the target's
# metadata file, so that data is never queried through the wrong backend.
PLUGIN_READS="sos dsos"
# Settings forwarded to remote steps, in addition to the core settings.
PLUGIN_VARS="SOS_PREFIX SOS_DATA_ROOT SOS_STORAGE SOS_ROW_LIMIT"
